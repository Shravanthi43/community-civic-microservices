<!DOCTYPE html>
<html>
<head>
    <title>Ward Service</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Community Civic Portal</h1>
    <h2>Ward Management</h2>

    <h3>Add New Ward</h3>

    <form id="wardForm">

        <label>Ward Number</label>
        <input type="text" id="wardNumber" placeholder="Example: 101" required>

        <label>Ward Name</label>
        <input type="text" id="wardName" placeholder="Example: Ward 101" required>

        <label>Area</label>
        <input type="text" id="area" placeholder="Example: Shivaji Nagar" required>

        <button type="submit">Add Ward</button>

    </form>

    <div id="result"></div>

    <hr>

    <h3>Check Ward Number</h3>

    <input type="text" id="searchWardNumber"
           placeholder="Enter Ward Number">

    <button onclick="findWardByNumber()">
        Check Ward
    </button>

    <div id="wardDetails"></div>

    <hr>

    <h3>Find Ward By ID</h3>

    <input type="number" id="searchWardId"
           placeholder="Enter Ward ID">

    <button onclick="findWard()">
        Find Ward
    </button>

    <div id="wardIdDetails"></div>

    <hr>

    <h3>All Registered Wards</h3>

    <button onclick="getAllWards()">
        View All Wards
    </button>

    <div id="allWards"></div>

</div>

<script src="script.js"></script>

</body>
</html>
